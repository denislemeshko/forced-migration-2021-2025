services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unhcr
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/processed:/imports:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d unhcr"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data: